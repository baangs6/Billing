{% extends 'base.html' %}{% from 'macros.html' import invoice_table %}{% block actions %}<a href="/billing" class="primary">＋ Create invoice</a>{% endblock %}{% block content %}<article class="panel"><form class="filter-bar"><input name="q" placeholder="Invoice or customer…" value="{{ request.args.get('q','') }}"><label>From<input type="date" name="from" value="{{ request.args.get('from','') }}"></label><label>To<input type="date" name="to" value="{{ request.args.get('to','') }}"></label><select name="customer"><option value="">All customers</option>{% for c in customers %}<option value="{{ c.id }}" {{ "selected" if request.args.get("customer")==c.id|string else "" }}>{{ c.name }}</option>{% endfor %}</select><select name="type"><option value="">All invoice types</option>{% for t in ['GST','NON-GST'] %}<option {{ 'selected' if request.args.get('type')==t else '' }}>{{ t }}</option>{% endfor %}</select><select name="payment"><option value="">All payment statuses</option>{% for t in ['PAID','PARTIAL','UNPAID'] %}<option {{ 'selected' if request.args.get('payment')==t else '' }}>{{ t }}</option>{% endfor %}</select><button class="secondary">Filter</button><a href="/invoices">Reset</a></form>{{ invoice_table(rows) }}</article>{% endblock %}
