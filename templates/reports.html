{% extends 'base.html' %}{% block content %}<article class="panel"><form class="filter-bar"><select name="report">{% for r in ['Sales','Daily sales','Monthly sales','GST sales','Non-GST sales','Outstanding','Collections','Product sales','Inventory','Low stock','Stock movement'] %}<option {{ 'selected' if kind==r else '' }}>{{ r }}</option>{% endfor %}</select><label>From<input name="from" type="date" value="{{ request.args.get('from','') }}"></label><label>To<input name="to" type="date" value="{{ request.args.get('to','') }}"></label><button class="primary">Run report</button><button name="export" value="csv" class="secondary">Export CSV</button><button name="export" value="pdf" class="secondary">Export PDF</button></form><div class="panel-heading"><h3>{{ kind }}</h3><span class="muted">{{ rows|length }} records</span></div><div class="table-wrap"><table><thead><tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>{% else %}<tr><td colspan="{{ headers|length }}" class="empty">No records for this report.</td></tr>{% endfor %}</tbody></table></div></article>{% endblock %}
