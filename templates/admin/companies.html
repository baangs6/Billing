{% extends 'admin/base.html' %}{% block content %}<div class="status-tabs">{% for status in ['','PENDING','ACTIVE','SUSPENDED','EXPIRED','REJECTED','ARCHIVED'] %}<a class="secondary {{ 'selected' if request.args.get('status','')==status else '' }}" href="?status={{ status }}">{{ status|title if status else 'All companies' }}</a>{% endfor %}</div><section class="panel"><form class="filter-bar"><label>Search<input name="q" value="{{ request.args.get('q','') }}" placeholder="Company, owner, phone, email"></label><input type="hidden" name="status" value="{{ request.args.get('status','') }}"><label>Plan<select name="plan"><option value="">All plans</option>{% for plan in plans %}<option value="{{ plan.id }}" {{ 'selected' if request.args.get('plan')==plan.id|string else '' }}>{{ plan.name }}</option>{% endfor %}</select></label><label>Registered from<input type="date" name="registered_from" value="{{ request.args.get('registered_from','') }}"></label><label>Registered to<input type="date" name="registered_to" value="{{ request.args.get('registered_to','') }}"></label><label>Expiry by<input type="date" name="expiry_to" value="{{ request.args.get('expiry_to','') }}"></label><button class="primary">Filter</button><a href="/companies">Reset</a></form>{% include 'admin/company_table.html' %}</section>{% endblock %}
