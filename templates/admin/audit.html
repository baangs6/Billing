{% extends 'admin/base.html' %}{% block subtitle %}An append-only record of owner actions and access changes.{% endblock %}{% block content %}<section class="panel"><form class="filter-bar"><label>Company<select name="business_id"><option value="">All companies</option>{% for row in companies %}<option value="{{ row.id }}" {{ 'selected' if request.args.get('business_id')==row.id|string else '' }}>{{ row.name }}</option>{% endfor %}</select></label><label>Admin<select name="admin_id"><option value="">All administrators</option>{% for row in admins %}<option value="{{ row.id }}">{{ row.name }}</option>{% endfor %}</select></label><label>Action<input name="action" placeholder="company.approve" value="{{ request.args.get('action','') }}"></label><label>From<input type="date" name="from" value="{{ request.args.get('from','') }}"></label><label>To<input type="date" name="to" value="{{ request.args.get('to','') }}"></label><button class="primary">Filter</button></form>{% include 'admin/audit_table.html' %}<div class="padded"><small>Showing up to 300 recent matching events. Narrow the date range to see older events.</small></div></section>{% endblock %}
