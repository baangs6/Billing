<div class="table-wrap"><table><tr><th>When</th><th>Admin</th><th>Company</th><th>Action</th><th>Change</th></tr>{% for row in events %}<tr><td>{{ row.created_at }}</td><td>{{ row.admin_id or 'System' }}</td><td>{{ row.business_id or 'Platform' }}</td><td>{{ row.action }}<small>{{ row.ip }}</small></td><td><details><summary>Before / after</summary><pre class="audit-json">{{ {'before':row.before,'after':row.after}|tojson(indent=2) }}</pre></details></td></tr>{% else %}<tr><td colspan="5" class="empty">No audit events match this view.</td></tr>{% endfor %}</table></div>
